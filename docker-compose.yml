# ============================================
# Virtual PPO/PPM — Full Stack Docker Compose
# ============================================
# Usage:
#   docker-compose up --build        (foreground)
#   docker-compose up --build -d     (background)
#   docker-compose down              (stop)

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vppo
      POSTGRES_USER: vppo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vppo_secret_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vppo"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Python Agent Service
  agents:
    build:
      context: .
      dockerfile: Dockerfile.agents
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      - NEXTJS_URL=http://app:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-http://host.docker.internal:11434}
    depends_on:
      db:
        condition: service_healthy

  # Python Scrapling Service (deep web scraping)
  scraper:
    build:
      context: ./python-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8200:8200"
    environment:
      - SCRAPER_SERVICE_PORT=8200
      - SCRAPER_HEADLESS=true
      - SCRAPER_MAX_CONCURRENT=3
      - SCRAPER_MAX_PAGES=5
      - NEXTJS_URL=http://app:3000
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8200/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Whisper ASR Service (speech-to-text for meeting bot)
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base
      - ASR_ENGINE=faster_whisper
    profiles:
      - meeting-bot

  # Meeting Bot Service (Zoom SDK + audio → Whisper → transcript)
  meeting-bot:
    build:
      context: ./meeting-bot
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8300:8300"
    environment:
      - WHISPER_URL=http://whisper:9000
      - CALLBACK_URL=http://app:3000/api/meetings/bot/transcript-chunk
    depends_on:
      whisper:
        condition: service_started
    profiles:
      - meeting-bot

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://vppo:${POSTGRES_PASSWORD:-vppo_secret_change_me}@db:5432/vppo
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?Set NEXTAUTH_SECRET in .env}
      - CREDENTIALS_ENCRYPTION_KEY=${CREDENTIALS_ENCRYPTION_KEY:-}
      - PYTHON_AGENTS_URL=http://agents:8100
      - SCRAPER_SERVICE_URL=http://scraper:8200
      # LLM Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
      - AZURE_OPENAI_DEPLOYMENT=${AZURE_OPENAI_DEPLOYMENT:-}
      - OLLAMA_ENDPOINT=${OLLAMA_ENDPOINT:-}
      # Integrations (optional — users configure in UI)
      - JIRA_BASE_URL=${JIRA_BASE_URL:-}
      - JIRA_EMAIL=${JIRA_EMAIL:-}
      - JIRA_API_TOKEN=${JIRA_API_TOKEN:-}
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_CHANNEL_ID=${SLACK_CHANNEL_ID:-}
      - CONFLUENCE_BASE_URL=${CONFLUENCE_BASE_URL:-}
      - CONFLUENCE_EMAIL=${CONFLUENCE_EMAIL:-}
      - CONFLUENCE_API_TOKEN=${CONFLUENCE_API_TOKEN:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL:-}
      # Meeting Bot
      - MEETING_BOT_SERVICE_URL=http://meeting-bot:8300
    depends_on:
      db:
        condition: service_healthy
      agents:
        condition: service_started
      scraper:
        condition: service_started

volumes:
  postgres_data:
